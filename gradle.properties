org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Optimized resource shrinking (AGP 8.12+): R8 optimizes code and resource
# references together instead of relying on AAPT2's unconditional keep rules.
# Requires isShrinkResources = true (already set on the release build type).
# Becomes the default behavior in AGP 9.0+, so this flag is a no-op once upgraded.
android.r8.optimizedResourceShrinking=true
